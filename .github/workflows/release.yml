# A v tag (v0.1.0) builds the package, checks it installs and runs, and publishes it as a GitHub release
# with the wheel and the source archive, its notes from .github/release-notes.md.
#
# PyPI (pip install dqvouch): with trusted publishing, no password or token is stored here. Once, on pypi.org:
# Account → Publishing → add a pending publisher: owner FuzzyLaDuzzy, repository dqvouch, workflow
# release.yml, environment pypi. Then in the repository's Settings → Secrets and variables → Actions →
# Variables, PUBLISH_TO_PYPI = true: every later tag also goes to PyPI. A tag released before that goes to
# PyPI by running this workflow by hand (Actions → release → Run workflow) on that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read  # only the release job writes (its own permissions, below)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The tag is the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs on its own and starts
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/dqvouch --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "dqvouch ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    if: github.ref_type == 'tag' && (vars.PUBLISH_TO_PYPI == 'true' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dqvouch/
    permissions:
      id-token: write  # trusted publishing: PyPI checks this workflow's identity, no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
