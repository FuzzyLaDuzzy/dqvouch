[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqvouch"
version = "0.2.0"
description = "An LLM proposes data quality tests, code validates them, you vouch for them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flávio Silva" }]
requires-python = ">=3.11"
keywords = ["data quality", "data testing", "llm", "gemini", "postgresql", "clickhouse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "clickhouse-connect>=1.6",
    "fastapi>=0.115",
    "google-genai>=2.17",
    "python-dotenv>=1.2",
    "psycopg[binary]>=3.2",
    "sqlglot>=30.30",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/FuzzyLaDuzzy/dqvouch"
Issues = "https://github.com/FuzzyLaDuzzy/dqvouch/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
dqvouch = "dqvouch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dqvouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
